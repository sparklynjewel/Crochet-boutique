<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere | Modern E-Commerce</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <p id="shop-loading" role="status" style="padding:24px;font-family:Arial,sans-serif">Loading CrochetStudio…</p>
    </div>
    <noscript>Please enable JavaScript in your browser to open CrochetStudio.</noscript>
    <script>
      window.setTimeout(function () {
        var loading = document.getElementById('shop-loading');
        if (loading) {
          loading.textContent = 'This page is taking longer to load. Try refreshing, or update Chrome and try again.';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
